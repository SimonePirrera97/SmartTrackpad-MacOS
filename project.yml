name: SmartTrackpad
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  iPadTrackpad:
    type: application
    platform: iOS
    sources:
      - apps/iPadTrackpad
      - apps/Shared
      - packages/TrackpadProtocol/Sources/TrackpadProtocol
      - packages/GestureCore/Sources/GestureCore
      - path: assets/lucide/LICENSE
        buildPhase: resources
    info:
      path: apps/iPadTrackpad/Info.plist
      properties:
        NSBonjourServices:
          - _smarttrackpad._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonepirrera.smarttrackpad.ipad
        DEVELOPMENT_TEAM: F3RB9G843M
        TARGETED_DEVICE_FAMILY: '2'
        INFOPLIST_KEY_CFBundleDisplayName: Smart Trackpad
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Control your Mac pointer from this iPad over an encrypted local connection.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown by your Mac. Camera images are not saved or sent.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  MacTrackpadCompanion:
    type: application
    platform: macOS
    sources:
      - apps/MacTrackpadCompanion
      - apps/Shared
      - packages/TrackpadProtocol/Sources/TrackpadProtocol
      - packages/GestureCore/Sources/GestureCore
      - path: assets/lucide/LICENSE
        buildPhase: resources
    info:
      path: apps/MacTrackpadCompanion/Info.plist
      properties:
        NSBonjourServices:
          - _smarttrackpad._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonepirrera.smarttrackpad.mac
        INFOPLIST_KEY_CFBundleDisplayName: Smart Trackpad Companion
        DEVELOPMENT_TEAM: F3RB9G843M
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Receive pointer, click and scroll input from your approved iPad over your local network.
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
schemes:
  iPadTrackpad:
    build:
      targets:
        iPadTrackpad: all
  MacTrackpadCompanion:
    build:
      targets:
        MacTrackpadCompanion: all
